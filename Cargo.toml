[package]
name = "egpu-painel"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
adlx = "0.0.0-alpha.1"
chrono = "0.4.45"
resvg = { version = "0.45.1", default-features = false }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_System_Performance", "Win32_System_EventLog", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Graphics_Direct3D12", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Security", "Win32_System_Com", "Win32_UI_Shell_Common", "Win32_System_Power", "Win32_System_Diagnostics_Debug", "Win32_System_Console", "Win32_System_Registry"] }
wmi = "0.18.4"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
